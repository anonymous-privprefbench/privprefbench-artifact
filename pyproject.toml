[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privprefbench"
version = "0.1.4"
description = "Privacy preference compliance benchmark for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "PrivPrefBench contributors"}]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.124"]
providers = ["openai>=1.0", "anthropic>=0.124"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["privprefbench*"]
